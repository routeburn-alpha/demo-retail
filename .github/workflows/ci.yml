# Server-side safety net that mirrors the local `/precommit` gate (FRAMEWORK.md
# Opinion 5: "the push gate is the only door"). It does NOT replace `/precommit`
# — it re-runs the same gate after push so a change that bypassed the local gate
# cannot reach `main` unnoticed.
#
# WHY FOUR JOBS INSTEAD OF ONE (platform #1130)
# ---------------------------------------------
# This used to be a single `precommit gate` job running `npm run precommit`. That
# is a correct gate and a useless report: a PR showed ONE checkbox, so a failure
# gave one red X covering four different concerns. The repo's thesis is that a
# change walks a LADDER of gates to production — this makes the rungs visible.
# The payoff is `security`: a change that leaks a hidden product (see
# standards/no-hidden-products-in-search.md) turns `security` red while `check`,
# `build` and `test` stay green, so the PR names the concern that failed.
#
# The local gate is UNCHANGED. `npm run precommit` (check -> build -> test) still
# runs everything, including the security tests, because `npm test` runs all
# vitest projects. Only CI splits the selection, via the `security` project in
# vitest.workspace.ts — a project, not a CLI `--exclude`, because a project's own
# exclude silently beats the flag.
#
# Jobs run in PARALLEL with no `needs`: every result is independent, which is what
# makes the ladder readable, and `build` is ~5s so gating it saves nothing. Note
# `check` and `build` no longer install Chromium or touch the database — they used
# to wait behind both.
#
# Tests run against REAL services (standards/no-mocks.md): real Chromium for
# browser-mode component tests, real Neon Postgres for the DB integration tests.
# The DB tests SKIP when DATABASE_URL is absent, so the DB-touching jobs require
# the secret and apply the schema with `db:push` first — if the secret is missing,
# `db:push` fails and the job goes red rather than silently skipping.
#
# CONCURRENT db:push: `test` and `security` both apply the schema, so two pushes
# can hit the CI database at once. It is a no-op introspect when the schema is
# unchanged, and concurrent PRs already push concurrently today. If this ever
# flakes, add a `setup-db` job that both `needs`.
#
# REQUIRED repo configuration: a `DATABASE_URL` Actions secret pointing at a real
# Postgres (ideally a dedicated Neon branch DB so CI never shares state with
# dev/prod). Set it on the canonical repo that owns the GitHub<->Vercel
# integration (routeburn-alpha/demo-retail). Branch protection on `main` requires
# all four job names below; renaming a job here means updating that setting.
name: CI

on:
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run; cancel the old one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only needs to read the repo.
permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type-check app + framework code
        run: npm run check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Real Postgres for the no-mocks integration tests. Absent secret -> db:push
      # fails -> job red (the intended "never silently skip" behavior).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        # Browser-mode component tests (vitest-browser-svelte) need a real browser.
        run: npx playwright install --with-deps chromium
      - name: Apply database schema
        run: npm run db:push
      - name: Run app tests (node + browser)
        run: npm run test:app

  security:
    name: security
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply database schema
        # No Chromium here: security tests are node + real Postgres today. A future
        # browser-based security test would need this job to install it too.
        run: npm run db:push
      - name: Run security-standard tests
        # Every src/**/*.security.test.ts — a new one joins by filename, no config change.
        run: npm run test:security
